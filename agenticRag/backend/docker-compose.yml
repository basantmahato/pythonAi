services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant-agentic
    ports:
      - "6333:6333" # REST API & Built-in Web UI Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
    driver: local
